version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hdr_backend
    restart: always

    ports:
      - "8000:8000"

    volumes:
      - .:/app
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./trained_models:/app/trained_models

    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/handwritten_db
      PYTHONUNBUFFERED: 1

    depends_on:
      - db

  db:
    image: postgres:16

    container_name: hdr_postgres

    restart: always

    environment:
      POSTGRES_DB: handwritten_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

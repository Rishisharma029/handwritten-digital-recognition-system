<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Handwritten OCR</title>
    <script>
      // GitHub Pages SPA redirect trick.
      // When GH Pages returns a 404 for a sub-path, this page captures the
      // full URL, encodes the path+query+hash into the search string, then
      // redirects to index.html which decodes it and pushes the real route.
      var segmentCount = 1; // number of path segments in the repo name
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.split('/').slice(1 + segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
